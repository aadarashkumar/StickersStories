<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Sticker Time - AR Experience</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Reset baseline page structure */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05081c;
    }

    /* --- PREMIUM LANDING OVERLAY STYLES --- */
    #landing-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh; /* Dynamic mobile screen height */
      overflow: hidden;
      z-index: 9999; /* Covers the AR camera view at startup */
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Group 1 Scaling Setup (Full Screen) */
    #bg-video-group1 {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Prevents stretching on all phone aspect ratios */
      object-position: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Group 2 Action Interactive Layer */
    #action-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* Natively rendering the Glossy Action Button */
    #start-camera-btn {
      background: url('btn-bubble.png') no-repeat center;
      background-size: contain;
      border: none;
      width: 280px;
      height: 75px;
      color: #ffffff;
      font-family: 'Arial Black', Gadget, sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.4);
      
      /* Pushes the button to sit neatly inside your AE blank spot layout */
      margin-top: auto; 
      margin-bottom: 110px; 
      
      transition: transform 0.1s ease;
    }

    /* Click down tactile behavior */
    #start-camera-btn:active {
      transform: scale(0.95);
    }

    /* Safe Fade out controller state */
    #landing-wrapper.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="landing-wrapper">
    
    <video id="bg-video-group1" autoplay loop muted playsinline>
      <source src="group1-main.mp4" type="video/mp4">
    </video>

    <div id="action-overlay">
      <button id="start-camera-btn">
        START CAMERA
      </button>
    </div>

  </div>

  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById('start-camera-btn');
      const landingWrapper = document.getElementById('landing-wrapper');
      const bgVideo = document.getElementById('bg-video-group1');

      // Double-insure native infinite browser looping loops perfectly
      bgVideo.loop = true;

      startBtn.addEventListener('click', () => {
        // Kick off the sleek fade-out CSS animation layer transition
        landingWrapper.classList.add('fade-out');

        // Pause the looping media layer immediately after it vanishes to preserve computing processing power
        setTimeout(() => {
          bgVideo.pause();
        }, 500);
      });
    });
  </script>

</body>
</html>
