<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Time AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05081c;
    }

    /* Renamed to force browser to drop old cache memory */
    #premium-landing-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; overflow: hidden; z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #bg-video-loop {
      width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; z-index: 1;
    }

    #interactive-overlay-plane {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    }

    #start-camera-btn {
      background: url('btn-bubble.png') no-repeat center !important;
      background-size: contain !important;
      border: none !important;
      width: 280px !important; 
      height: 75px !important;
      cursor: pointer;
      margin-top: auto; 
      margin-bottom: 110px; 
      transition: transform 0.1s ease;
      background-color: transparent !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
      
      /* Purely structural graphic: Absolutely NO text generation allowed */
      color: transparent !important;
      font-size: 0px !important;
      line-height: 0 !important;
      text-indent: -9999px !important;
    }

    #start-camera-btn:active {
      transform: scale(0.95);
    }

    #premium-landing-view.hide-me {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <div id="premium-landing-view">
    
    <video id="bg-video-loop" autoplay loop muted playsinline>
      <source src="group1-main.mp4" type="video/mp4">
    </video>

    <div id="interactive-overlay-plane">
      <button id="start-camera-btn"></button>
    </div>

  </div>

  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById('start-camera-btn');
      const landingScreen = document.getElementById('premium-landing-view');
      const loopVideo = document.getElementById('bg-video-loop');

      // Loop validation
      loopVideo.loop = true;

      // Unmute trigger sequence via screen contact interaction
      const engageAudioSystem = () => {
        loopVideo.muted = false;
        loopVideo.play().catch(err => console.log("Audio waiting for harder gesture:", err));
        
        // Kill listener nodes after initial tap validation
        document.removeEventListener('click', engageAudioSystem);
        document.removeEventListener('touchstart', engageAudioSystem);
      };
      document.addEventListener('click', engageAudioSystem);
      document.addEventListener('touchstart', engageAudioSystem);

      // Button execution sequence
      startBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        event.preventDefault();

        // Wake up MindAR camera stream explicitly via framework system nodes
        const productionScene = document.querySelector('a-scene');
        if (productionScene && productionScene.systems['mindar-image-system']) {
          console.log("Kicking MindAR engine awake...");
          productionScene.systems['mindar-image-system'].start();
        }

        // Drop visual overlay plane
        landingScreen.classList.add('hide-me');

        // Kill audio/video rendering engines to free background RAM allocation
        setTimeout(() => {
          loopVideo.pause();
        }, 400);
      });
    });
  </script>

</body>
</html>
