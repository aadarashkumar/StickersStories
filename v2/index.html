<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Sticker Time - AR Experience</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Reset baseline page viewport framework */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05081c;
    }

    /* --- PREMIUM LANDING OVERLAY STYLES --- */
    #landing-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh; /* Dynamic mobile viewport height */
      overflow: hidden;
      z-index: 9999; /* Guarantees layout covers canvas on initialization */
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Group 1 Full-Screen Media Layer Rendering */
    #bg-video-group1 {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Responsively fills device bounds without stretching typography */
      object-position: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Group 2 Interactive UI Overlay Container */
    #action-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* The Glossy Button Setup (Empty Text Canvas) */
    #start-camera-btn {
      background: url('btn-bubble.png') no-repeat center;
      background-size: contain;
      border: none;
      width: 280px; 
      height: 75px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* Pushes the button to sit neatly inside your AE blank spot layout */
      margin-top: auto; 
      margin-bottom: 110px; 
      
      transition: transform 0.1s ease;
      background-color: transparent !important;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Responsive tap feedback */
    #start-camera-btn:active {
      transform: scale(0.95);
    }

    /* Transitions out landing interface seamlessly */
    #landing-wrapper.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="landing-wrapper">
    
    <video id="bg-video-group1" autoplay loop muted playsinline>
      <source src="group1-main.mp4" type="video/mp4">
    </video>

    <div id="action-overlay">
      <button id="start-camera-btn"></button>
    </div>

  </div>

  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById('start-camera-btn');
      const landingWrapper = document.getElementById('landing-wrapper');
      const bgVideo = document.getElementById('bg-video-group1');

      bgVideo.loop = true;

      // WORKAROUND: Unmute the video the absolute split-second the user touches the screen
      const unmuteAudio = () => {
        bgVideo.muted = false;
        // Remove listeners once activated so we don't keep firing it needlessly
        document.removeEventListener('click', unmuteAudio);
        document.removeEventListener('touchstart', unmuteAudio);
      };
      document.addEventListener('click', unmuteAudio);
      document.addEventListener('touchstart', unmuteAudio);

      startBtn.addEventListener('click', (e) => {
        // Prevent the general screen touch listener from colliding with the button transition
        e.stopPropagation(); 
        
        // 1. Wake up the MindAR camera system stream
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.systems['mindar-image-system']) {
          sceneEl.systems['mindar-image-system'].start();
        }

        // 2. Fade out the landing interface 
        landingWrapper.classList.add('fade-out');

        // 3. Stop the video loop audio track after it vanishes to clear the audio channels
        setTimeout(() => {
          bgVideo.pause();
        }, 500);
      });
    });
  </script>

</body>
</html>
