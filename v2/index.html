<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Time AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05081c;
    }

    /* Core UI Landing Screen Layout */
    #premium-landing-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; overflow: hidden; z-index: 99999;
    }

    #bg-video-loop {
      width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; z-index: 1;
    }

    #interactive-overlay-plane {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    }

    #start-camera-btn {
      background: url('btn-bubble.png') no-repeat center !important;
      background-size: contain !important;
      border: none !important;
      width: 280px !important; 
      height: 75px !important;
      cursor: pointer;
      margin-top: auto; 
      margin-bottom: 110px; 
      transition: transform 0.1s ease;
      background-color: transparent !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
      color: transparent !important;
      font-size: 0px !important;
    }

    #start-camera-btn:active {
      transform: scale(0.95);
    }

    /* Target Container for dynamically generated AR Camera */
    #ar-container {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10;
    }
  </style>
</head>
<body>

  <div id="premium-landing-view">
    <video id="bg-video-loop" autoplay loop muted playsinline>
      <source src="group1-main.mp4" type="video/mp4">
    </video>
    <div id="interactive-overlay-plane">
      <button id="start-camera-btn"></button>
    </div>
  </div>

  <div id="ar-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById('start-camera-btn');
      const landingScreen = document.getElementById('premium-landing-view');
      const loopVideo = document.getElementById('bg-video-loop');
      const arContainer = document.getElementById('ar-container');

      loopVideo.loop = true;

      // Handle custom audio activation on user touch interaction
      const engageAudioSystem = () => {
        loopVideo.muted = false;
        loopVideo.play().catch(err => console.log("Audio ready:", err));
        document.removeEventListener('click', engageAudioSystem);
        document.removeEventListener('touchstart', engageAudioSystem);
      };
      document.addEventListener('click', engageAudioSystem);
      document.addEventListener('touchstart', engageAudioSystem);

      // Triggered cleanly only when user intends to open camera hardware
      startBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        event.preventDefault();

        // Step A: Stop background looping media asset and destroy the landing page layout completely
        loopVideo.pause();
        landingScreen.remove(); 

        // Step B: Inject a completely fresh, unconflicted AR Canvas element into the page setup
        arContainer.innerHTML = `
          <a-scene mindar-image="imageTargetSrc: v2-target.mind; autoStart: true; uiLoading: no; uiError: no;" 
                   color-space="sRGB" 
                   renderer="colorManagement: true, physicallyCorrectLights" 
                   vr-mode-ui="enabled: false" 
                   device-orientation-permission-ui="enabled: false">
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity mindar-image-target="targetIndex: 0"></a-entity>
          </a-scene>
        `;
      });
    });
  </script>

</body>
</html>
