<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Time AR</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05081c;
      font-family: Arial, sans-serif;
    }

    /* Landing Screen Interface Overlays */
    #premium-landing-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; overflow: hidden; z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #bg-video-loop {
      width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; z-index: 1;
    }

    #interactive-overlay-plane {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    }

    #start-camera-btn {
      background: url('btn-bubble.png') no-repeat center !important;
      background-size: contain !important;
      border: none !important;
      width: 280px !important; 
      height: 75px !important;
      cursor: pointer;
      margin-top: auto; 
      margin-bottom: 110px; 
      transition: transform 0.1s ease;
      background-color: transparent !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    #start-camera-btn:active {
      transform: scale(0.95);
    }

    #premium-landing-view.hide-me {
      opacity: 0 !important; visibility: hidden !important; pointer-events: none !important;
    }

    /* Container holding your active camera feed */
    #camera-viewport-container {
      width: 100vw; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 10;
    }
  </style>
</head>
<body>

  <div id="premium-landing-view">
    <video id="bg-video-loop" autoplay loop muted playsinline>
      <source src="group1-main.mp4" type="video/mp4">
    </video>
    <div id="interactive-overlay-plane">
      <button id="start-camera-btn"></button>
    </div>
  </div>

  <div id="camera-viewport-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById('start-camera-btn');
      const landingScreen = document.getElementById('premium-landing-view');
      const loopVideo = document.getElementById('bg-video-loop');
      const container = document.getElementById('camera-viewport-container');

      loopVideo.loop = true;

      // Handle custom audio activation on tap gesture
      const engageAudioSystem = () => {
        loopVideo.muted = false;
        loopVideo.play().catch(err => console.log("Audio waiting...", err));
        document.removeEventListener('click', engageAudioSystem);
        document.removeEventListener('touchstart', engageAudioSystem);
      };
      document.addEventListener('click', engageAudioSystem);
      document.addEventListener('touchstart', engageAudioSystem);

      // Button setup to initialize standard camera capture directly
      startBtn.addEventListener('click', async (event) => {
        event.stopPropagation();
        event.preventDefault();

        // 1. Hide the video loop instantly 
        landingScreen.classList.add('hide-me');
        setTimeout(() => { loopVideo.pause(); }, 500);

        // 2. Initialize the native standalone MindAR controller
        const mindarThree = new window.MINDAR.IMAGE.MindARImage({
          container: container,
          imageTargetSrc: 'v2-target.mind',
          uiLoading: "no",
          uiError: "no"
        });

        // 3. Force the native device lens open completely bypassing 3D frames
        try {
          await mindarThree.start();
          console.log("Camera engine loaded successfully!");
        } catch (err) {
          console.error("Camera access failed:", err);
          alert("Please check your browser settings and allow camera permissions!");
        }
      });
    });
  </script>

</body>
</html>
