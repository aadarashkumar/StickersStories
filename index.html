<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    <style>
      .btn-overlay { position: fixed; top: 20px; left: 20px; z-index: 9999; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 8px; font-family: sans-serif; }
      .start-btn { background: #FFDF00; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <div class="btn-overlay">
      <div id="status">1. Tap to Start:</div>
      <button onclick="armSystem()" class="start-btn">ACTIVATE CAMERA 🔊</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="bhaw-vid" src="bhaw.mp4" loop="true" playsinline crossorigin="anonymous" webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="sticker-target">
        <a-video src="#bhaw-vid" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('bhaw-vid');
      const statusText = document.getElementById('status');
      const sceneEl = document.querySelector('a-scene');

      // Make sure video is absolutely paused on initial layout load
      video.pause();

      function armSystem() {
        // Unlocks mobile media restrictions cleanly
        video.play().then(() => { 
          video.pause(); 
          statusText.innerText = "2. Camera Active! Scan Sticker.";
          statusText.style.color = "#00ff00";
          
          // This forces the physical camera hardware to open up and stream
          sceneEl.systems["mindar-image-system"].start();
        }).catch(err => {
          console.log("Camera engine startup blocked:", err);
        });
      }

      // Strict tracking event listeners
      const targetEntity = document.getElementById('sticker-target');
      
      targetEntity.addEventListener("targetFound", event => {
        statusText.innerText = "STICKER MATCHED! 🎉";
        video.play();
      });

      targetEntity.addEventListener("targetLost", event => {
        statusText.innerText = "Scanning for Sticker...";
        video.pause();
      });
    </script>
  </body>
</html>
