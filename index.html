<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <div style="position: fixed; top: 10px; left: 10px; z-index: 999; background: white; padding: 10px; border-radius: 5px; font-family: sans-serif;">
      <p style="margin: 0 0 10px 0; font-size: 12px;">AR Ready! Tap below to activate audio:</p>
      <button onclick="startAudio()" style="background: #FFDF00; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer;">ENABLE SOUND 🔊</button>
    </div>

    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <video id="bhaw-vid" src="bhaw.mp4" loop="true" playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-nft id="marker-bhaw" type="nft" url="bhaw" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
        <a-video src="#bhaw-vid" width="150" height="150" position="0 0 0" rotation="-90 0 0"></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('bhaw-vid');
      
      // Unlocks the audio tracking instantly on tap
      function startAudio() {
        video.play().then(() => { video.pause(); });
      }

      // Tracking hooks
      const marker = document.getElementById('marker-bhaw');
      marker.addEventListener('markerFound', () => { video.play(); });
      marker.addEventListener('markerLost', () => { video.pause(); });
    </script>
  </body>
</html>
