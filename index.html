<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      .brand-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #1a1a1a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ffffff; font-family: sans-serif; text-align: center; transition: opacity 0.5s ease; }
      .brand-title { font-size: 28px; font-weight: bold; color: #FFDF00; margin-bottom: 20px; }
      .start-btn { display: none; padding: 15px 35px; font-size: 18px; font-weight: bold; color: #1a1a1a; background-color: #FFDF00; border: none; border-radius: 30px; cursor: pointer; }
      .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #FFDF00; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <div id="loaderScreen" class="brand-loader">
      <div class="brand-title">MY AR STICKERS</div>
      <div id="loadingStatus" style="margin-bottom: 20px; color: #aaa;">Loading Sound & Framework...</div>
      <div id="loadingSpinner" class="spinner"></div>
      <button id="startBtn" class="start-btn">TAP TO ENTER AR 🔊</button>
    </div>

    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <video id="sticker1-vid" src="animation.mp4" loop="true" playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-nft id="marker-sticker1" type="nft" url="sticker-art" smooth="true" smoothCount="10">
        <a-video src="#sticker1-vid" width="150" height="150" position="0 0 0" rotation="-90 0 0"></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const loader = document.getElementById('loaderScreen');
      const startBtn = document.getElementById('startBtn');
      const spinner = document.getElementById('loadingSpinner');
      const statusText = document.getElementById('loadingStatus');

      window.addEventListener('arjs-nft-loaded', function() {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        startBtn.style.display = 'block'; 
      });

      startBtn.addEventListener('click', function() {
        document.querySelectorAll('video').forEach(video => {
          video.play().then(() => { video.pause(); }).catch(e => console.log(e));
        });
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 500);
      });

      const marker = document.getElementById('marker-sticker1');
      const video = document.getElementById('sticker1-vid');
      marker.addEventListener('markerFound', () => { video.play(); });
      marker.addEventListener('markerLost', () => { video.pause(); });
    </script>
  </body>
</html>
